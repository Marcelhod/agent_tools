[project]
name = "agent-tools"
version = "0.1.0"
description = "An MCP server for scaffolding FastAPI projects and databases."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
]

[project.scripts]
agent-tools = "agent_tools.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tools"]