[project]
name = "agent-tools"
version = "0.1.0"
description = "MCP Server for scaffolding full-stack apps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
]

[project.scripts]
agent-tools = "agent_tools.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tools"]

[tool.uv.workspace]
members = [
    "projects/my-app",
    "projects/test-app",
]
